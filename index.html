<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialty Coffee Live Subtitles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .text-shadow { text-shadow: 2px 2px 5px rgba(0,0,0,0.9); }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .settings-hidden { transform: translateY(-100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col justify-between">

    <!-- Top Settings Panel -->
    <div id="settingsPanel" class="absolute top-0 w-full bg-gray-900 border-b border-gray-700 p-4 z-50 flex flex-wrap gap-4 items-center justify-center transition-transform duration-300 shadow-2xl">
        <div class="flex items-center gap-2">
            <label for="apiKey" class="text-gray-400 text-sm font-semibold">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." class="bg-gray-800 text-white border border-gray-600 rounded px-3 py-2 w-64 focus:outline-none focus:border-blue-500 text-sm">
        </div>
        
        <div class="flex items-center gap-2">
            <label for="directionSelect" class="text-gray-400 text-sm font-semibold">Direction</label>
            <select id="directionSelect" class="bg-gray-800 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500 text-sm">
                <option value="es-to-ko">Spanish → Korean (Producer Session)</option>
                <option value="en-to-ko">English → Korean (Presenter Session)</option>
                <option value="ko-to-es">Korean → Spanish (Q&A Session)</option>
                <option value="ko-to-en">Korean → English (Q&A Session)</option>
            </select>
        </div>

        <button id="startBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded transition shadow-lg">Start Microphone</button>
        <button id="stopBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded transition shadow-lg hidden">Stop Microphone</button>
        
        <button id="hideSettingsBtn" class="absolute right-4 top-4 text-gray-400 hover:text-white text-sm bg-gray-800 px-3 py-1 rounded">▲ Hide Settings</button>
    </div>

    <!-- Toggle Settings Button -->
    <button id="showSettingsBtn" class="absolute right-4 top-4 text-gray-500 hover:text-white text-sm bg-gray-900 px-3 py-1 rounded z-40 hidden border border-gray-700 shadow-lg">▼ Settings</button>

    <!-- Subtitle History Stack Container (10 sentences, auto-scroll, full-text wrap) -->
    <div id="subtitlesContainer" class="flex-grow overflow-y-auto no-scrollbar px-6 md:px-16 pt-16 pb-6 w-full max-w-6xl mx-auto z-10 flex flex-col justify-end">
        <div id="subtitlesList" class="flex flex-col gap-4 w-full">
            <div class="text-gray-600 text-lg md:text-2xl text-center py-10">
                Waiting for speech... Please configure API Key and start the microphone in settings.
            </div>
        </div>

        <!-- Real-time Spoken Text Preview -->
        <div id="liveOriginalText" class="text-cyan-400 text-sm md:text-base italic mt-3 min-h-[1.5rem] tracking-wide font-light break-words whitespace-pre-wrap"></div>
    </div>

    <!-- Bottom Status Bar -->
    <div class="w-full text-center pb-3 z-10">
        <span id="statusIndicator" class="inline-block px-4 py-1 rounded-full bg-gray-900 text-gray-400 text-xs md:text-sm font-semibold border border-gray-800 shadow">
            Status: Ready
        </span>
    </div>

    <script>
        const settingsPanel = document.getElementById('settingsPanel');
        const hideSettingsBtn = document.getElementById('hideSettingsBtn');
        const showSettingsBtn = document.getElementById('showSettingsBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const directionSelect = document.getElementById('directionSelect');
        const subtitlesContainer = document.getElementById('subtitlesContainer');
        const subtitlesList = document.getElementById('subtitlesList');
        const liveOriginalText = document.getElementById('liveOriginalText');
        const statusIndicator = document.getElementById('statusIndicator');

        const subtitleHistory = [];
        const MAX_HISTORY = 10;

        try {
            const savedKey = localStorage.getItem('GEMINI_API_KEY');
            if (savedKey) apiKeyInput.value = savedKey;
            apiKeyInput.addEventListener('input', () => {
                try { localStorage.setItem('GEMINI_API_KEY', apiKeyInput.value.trim()); } catch(e) {}
            });
        } catch (e) {
            console.warn("localStorage restricted");
        }

        const STT_LANG_MAP = {
            'es-to-ko': 'es-CO',
            'en-to-ko': 'en-US',
            'ko-to-es': 'ko-KR',
            'ko-to-en': 'ko-KR'
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRunning = false;
        let sessionStartIndex = 0;
        let accumulatedText = "";
        let currentSessionChunk = "";
        let silenceTimer = null;
        let restartTimeout = null;

        if (SpeechRecognition) {
            try {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
            } catch (e) {
                console.error("SpeechRecognition initialization failed:", e);
            }
        }

        function updateStatus(message, textColor = "text-gray-400", bgColor = "bg-gray-900") {
            statusIndicator.textContent = message;
            statusIndicator.className = `inline-block px-4 py-1 rounded-full text-xs md:text-sm font-semibold border border-gray-800 shadow ${textColor} ${bgColor}`;
        }

        function renderSubtitles() {
            if (subtitleHistory.length === 0) return;

            subtitlesList.innerHTML = subtitleHistory.map((item, index) => {
                const total = subtitleHistory.length;
                const distance = total - 1 - index;

                let opacityClass = "opacity-100";
                let originalSize = "text-xs md:text-sm text-gray-400";
                let translatedSize = "text-xl md:text-3xl font-bold text-white text-shadow";

                if (distance === 1 || distance === 2) {
                    opacityClass = "opacity-85";
                    originalSize = "text-xs text-gray-500";
                    translatedSize = "text-lg md:text-2xl font-semibold text-gray-200";
                } else if (distance >= 3 && distance <= 5) {
                    opacityClass = "opacity-55";
                    originalSize = "text-[11px] text-gray-600";
                    translatedSize = "text-base md:text-xl font-medium text-gray-400";
                } else if (distance > 5) {
                    opacityClass = "opacity-30";
                    originalSize = "text-[10px] text-gray-700";
                    translatedSize = "text-sm md:text-base font-normal text-gray-500";
                }

                return `
                    <div class="fade-in transition-all duration-200 ${opacityClass} border-b border-gray-900 pb-3">
                        <div class="${originalSize} italic mb-1 break-words whitespace-pre-wrap">${item.original}</div>
                        <div class="${translatedSize} leading-relaxed break-words whitespace-pre-wrap">${item.translated}</div>
                    </div>
                `;
            }).join('');

            requestAnimationFrame(() => {
                subtitlesContainer.scrollTop = subtitlesContainer.scrollHeight;
            });
        }

        function getSystemPrompt(direction) {
            if (direction === 'ko-to-es') {
                return `Eres un intérprete simultáneo profesional especializado en catas de café de especialidad.
Traduce el texto hablado en coreano a un español natural y profesional para productores y catadores latinoamericanos.
- 워시드 -> Lavado (NUNCA 'lavandería' ni 'ropa lavada')
- 내추럴 -> Natural, 무산소 발효 -> Fermentación anaeróbica, 탄산침용 -> Maceración carbónica
- 가공장 / 습식가공소 -> Beneficio húmedo, 파치먼트 -> Café pergamino, 생두 -> Café verde
- 농장 -> Finca, 로트 -> Lote
- Salida ÚNICAMENTE la traducción en español. Sin saludos, sin notas explicativas.`;
            } else if (direction === 'ko-to-en') {
                return `You are a professional simultaneous interpreter specialized in specialty coffee cupping.
Translate the Korean spoken input into natural, fluent English using coffee industry standards.
- 워시드 -> Washed process, 내추럴 -> Natural process
- 무산소 발효 -> Anaerobic fermentation, 탄산침용 -> Carbonic maceration
- 가공장 -> Wet mill / Washing station / Processing facility
- 파치먼트 -> Parchment coffee, 생두 -> Green coffee
- 농장 -> Farm / Finca, 로트 -> Lot
- Output ONLY the English translation. No greetings, no explanations.`;
            } else {
                return `You are a specialty coffee simultaneous interpreter.
Translate speech into natural, professional Korean using standard coffee industry terms.
- Beneficio -> 가공장 (NEVER '이익' or '혜택')
- Lavado -> 워시드 (NEVER '세탁')
- Natural -> 내추럴, Anaerobic -> 무산소 발효
- Finca -> 농장, Lote -> 로트, Pergamino -> 파치먼트
- Output ONLY the Korean translation. No greetings, no notes.`;
            }
        }

        const MODEL_CANDIDATES = ['gemini-3.5-flash', 'gemini-3.5-flash-lite'];
        let activeModel = null;

        async function translateTextWithGemini(text) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) throw new Error("Missing API Key");

            const direction = directionSelect.value;
            const systemPrompt = getSystemPrompt(direction);

            const payload = {
                contents: [{ parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { 
                    temperature: 0.1,
                    thinkingConfig: {
                        thinkingBudget: 0
                    }
                }
            };

            const modelsToTry = activeModel ? [activeModel] : MODEL_CANDIDATES;
            let lastErrorMsg = "";

            for (const model of modelsToTry) {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const translated = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (translated) {
                            activeModel = model;
                            return translated.trim();
                        }
                    } else {
                        if (response.status === 400 && payload.generationConfig?.thinkingConfig) {
                            delete payload.generationConfig.thinkingConfig;
                            const retryRes = await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            if (retryRes.ok) {
                                const retryResult = await retryRes.json();
                                const translated = retryResult.candidates?.[0]?.content?.parts?.[0]?.text;
                                if (translated) {
                                    activeModel = model;
                                    return translated.trim();
                                }
                            }
                        }
                        const errData = await response.json().catch(() => ({}));
                        lastErrorMsg = errData.error?.message || `HTTP ${response.status}`;
                    }
                } catch (e) {
                    lastErrorMsg = e.message;
                }
            }
            throw new Error(lastErrorMsg || "Translation request failed");
        }

        // 모바일 오디오 충돌을 방어하는 안전 재시작 워치독
        function restartRecognition() {
            if (!isRunning) return;
            clearTimeout(restartTimeout);
            restartTimeout = setTimeout(() => {
                if (!isRunning) return;
                try {
                    recognition.start();
                } catch (e) {
                    // 기기가 아직 이전 오디오 세션을 닫는 중이면 300ms 후 자동 재시도
                    restartRecognition();
                }
            }, 300);
        }

        if (recognition) {
            recognition.onstart = () => {
                sessionStartIndex = 0;
                updateStatus("Mic Active: Listening...", "text-green-400", "bg-gray-900");
            };

            recognition.onresult = (event) => {
                let finalPart = "";
                let interimPart = "";

                // 번역된 과거 문장은 건너뛰고 현재 발화 중인 인덱스부터 온전히 추출
                for (let i = sessionStartIndex; i < event.results.length; ++i) {
                    const item = event.results[i];
                    if (item.isFinal) {
                        finalPart += item[0].transcript + " ";
                    } else {
                        interimPart += item[0].transcript;
                    }
                }

                currentSessionChunk = (finalPart + interimPart).trim();

                // 모바일 재연결 전 누적분과 현재 발화를 매끄럽게 연결
                const fullSpeech = [accumulatedText, currentSessionChunk].filter(Boolean).join(" ").trim();

                if (fullSpeech) {
                    liveOriginalText.textContent = `🎙️ ${fullSpeech}`;

                    clearTimeout(silenceTimer);
                    // 3초간 말이 멈추면 한 덩어리로 묶어 번역
                    silenceTimer = setTimeout(async () => {
                        const textToTranslate = fullSpeech;
                        accumulatedText = "";
                        currentSessionChunk = "";
                        sessionStartIndex = event.results.length; // 번역된 위치를 기억해 중복 방지
                        liveOriginalText.textContent = "";

                        if (textToTranslate) {
                            const currentItem = {
                                original: textToTranslate,
                                translated: '<span class="text-yellow-400 animate-pulse text-base md:text-xl">⏳ Translating...</span>'
                            };
                            subtitleHistory.push(currentItem);
                            if (subtitleHistory.length > MAX_HISTORY) subtitleHistory.shift();
                            renderSubtitles();

                            updateStatus("AI Translating...", "text-yellow-400", "bg-gray-900");

                            try {
                                const translated = await translateTextWithGemini(textToTranslate);
                                currentItem.translated = translated;
                                renderSubtitles();
                                updateStatus("Mic Active: Listening...", "text-green-400", "bg-gray-900");
                            } catch (error) {
                                currentItem.translated = `<span class="text-red-500">Translation Failed: ${error.message}</span>`;
                                renderSubtitles();
                                updateStatus("Translation Error", "text-red-400", "bg-gray-900");
                            }
                        }
                    }, 3000);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    isRunning = false;
                    alert("Microphone permission denied. Please allow microphone in settings.");
                    updateStatus("Error: Mic Denied", "text-red-400", "bg-gray-900");
                }
            };

            recognition.onend = () => {
                // 모바일에서 마이크가 갑자기 끊겨도 방금 인식한 문장을 보존
                if (currentSessionChunk) {
                    accumulatedText = [accumulatedText, currentSessionChunk].filter(Boolean).join(" ").trim();
                    currentSessionChunk = "";
                }

                if (isRunning) {
                    restartRecognition();
                } else {
                    updateStatus("Status: Stopped", "text-gray-400", "bg-gray-900");
                }
            };
        }

        startBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Please enter your Gemini API Key first.");
                updateStatus("Please enter API Key first", "text-red-400", "bg-gray-900");
                apiKeyInput.focus();
                return;
            }

            if (!recognition) {
                alert("Speech recognition is not supported in this browser.\nPlease open this tool in Google Chrome.");
                updateStatus("Error: Browser not supported", "text-red-400", "bg-gray-900");
                return;
            }

            try {
                const direction = directionSelect.value;
                recognition.lang = STT_LANG_MAP[direction] || 'en-US';
                isRunning = true;
                sessionStartIndex = 0;
                accumulatedText = "";
                currentSessionChunk = "";
                recognition.start();
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                settingsPanel.classList.add('settings-hidden');
                showSettingsBtn.classList.remove('hidden');
                liveOriginalText.textContent = "";
            } catch (err) {
                alert("Microphone start error: " + err.message);
                updateStatus("Mic Start Error", "text-red-400", "bg-gray-900");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (recognition) {
                isRunning = false;
                clearTimeout(silenceTimer);
                clearTimeout(restartTimeout);
                recognition.stop();
                stopBtn.classList.add('hidden');
                startBtn.classList.remove('hidden');
            }
        });

        hideSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.add('settings-hidden');
            showSettingsBtn.classList.remove('hidden');
        });

        showSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.remove('settings-hidden');
            showSettingsBtn.classList.add('hidden');
        });

        directionSelect.addEventListener('change', () => {
            if (isRunning && recognition) {
                const direction = directionSelect.value;
                recognition.lang = STT_LANG_MAP[direction] || 'en-US';
                recognition.stop();
            }
        });
    </script>
</body>
</html>
