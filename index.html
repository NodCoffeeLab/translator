<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈니스 커핑 실시간 통역기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .text-shadow { text-shadow: 2px 2px 5px rgba(0,0,0,0.9); }
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .settings-hidden { transform: translateY(-100%); }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col justify-between">

    <!-- 상단 설정 패널 -->
    <div id="settingsPanel" class="absolute top-0 w-full bg-gray-900 border-b border-gray-700 p-4 z-50 flex flex-wrap gap-4 items-center justify-center transition-transform duration-300 shadow-2xl">
        <div class="flex items-center gap-2">
            <label for="apiKey" class="text-gray-400 text-sm font-semibold">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." class="bg-gray-800 text-white border border-gray-600 rounded px-3 py-2 w-64 focus:outline-none focus:border-blue-500 text-sm">
        </div>
        
        <div class="flex items-center gap-2">
            <label for="language" class="text-gray-400 text-sm font-semibold">음성 언어</label>
            <select id="language" class="bg-gray-800 text-white border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500 text-sm">
                <option value="en-US">English (US) - 영어</option>
                <option value="es-CO">Spanish (Colombia) - 스페인어</option>
            </select>
        </div>

        <button id="startBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded transition shadow-lg">마이크 켜기 (Start)</button>
        <button id="stopBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded transition shadow-lg hidden">마이크 끄기 (Stop)</button>
        
        <button id="hideSettingsBtn" class="absolute right-4 top-4 text-gray-400 hover:text-white text-sm bg-gray-800 px-3 py-1 rounded">▲ 패널 숨기기</button>
    </div>

    <!-- 설정 패널 토글 버튼 -->
    <button id="showSettingsBtn" class="absolute right-4 top-4 text-gray-500 hover:text-white text-sm bg-gray-900 px-3 py-1 rounded z-40 hidden border border-gray-700 shadow-lg">▼ 설정 열기</button>

    <!-- 자막 히스토리 스택 영역 (최근 3문장 유지) -->
    <div class="flex-grow flex flex-col justify-end px-6 md:px-16 pb-16 w-full max-w-6xl mx-auto z-10">
        <div id="subtitlesList" class="flex flex-col gap-4 w-full">
            <div class="text-gray-600 text-xl md:text-3xl text-center py-10">
                대기 중입니다. 상단 설정에서 API Key 확인 후 마이크를 켜주세요.
            </div>
        </div>

        <!-- 실시간 마이크 수음 표시줄 -->
        <div id="liveOriginalText" class="text-cyan-400 text-sm md:text-lg italic mt-4 min-h-[1.5rem] tracking-wide font-light truncate"></div>
    </div>

    <!-- 하단 상태 표시줄 -->
    <div class="w-full text-center pb-3 z-10">
        <span id="statusIndicator" class="inline-block px-4 py-1 rounded-full bg-gray-900 text-gray-400 text-xs md:text-sm font-semibold border border-gray-800 shadow">
            상태: 준비됨 (Ready)
        </span>
    </div>

    <script>
        const settingsPanel = document.getElementById('settingsPanel');
        const hideSettingsBtn = document.getElementById('hideSettingsBtn');
        const showSettingsBtn = document.getElementById('showSettingsBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const languageSelect = document.getElementById('language');
        const subtitlesList = document.getElementById('subtitlesList');
        const liveOriginalText = document.getElementById('liveOriginalText');
        const statusIndicator = document.getElementById('statusIndicator');

        const subtitleHistory = [];
        const MAX_HISTORY = 3;

        // 시크릿 모드에서도 에러 없이 안전하게 동작하도록 예외 처리
        try {
            const savedKey = localStorage.getItem('GEMINI_API_KEY');
            if (savedKey) apiKeyInput.value = savedKey;
            apiKeyInput.addEventListener('input', () => {
                try { localStorage.setItem('GEMINI_API_KEY', apiKeyInput.value.trim()); } catch(e) {}
            });
        } catch (e) {
            console.warn("시크릿 모드: localStorage 접근 제한됨");
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRunning = false;

        if (SpeechRecognition) {
            try {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
            } catch (e) {
                console.error("음성 인식 객체 초기화 실패:", e);
            }
        }

        function updateStatus(message, textColor = "text-gray-400", bgColor = "bg-gray-900") {
            statusIndicator.textContent = message;
            statusIndicator.className = `inline-block px-4 py-1 rounded-full text-xs md:text-sm font-semibold border border-gray-800 shadow ${textColor} ${bgColor}`;
        }

        function renderSubtitles() {
            if (subtitleHistory.length === 0) return;

            subtitlesList.innerHTML = subtitleHistory.map((item, index) => {
                const total = subtitleHistory.length;
                const distance = total - 1 - index;

                let opacityClass = "opacity-100";
                let originalSize = "text-xs md:text-base text-gray-400";
                let translatedSize = "text-2xl md:text-4xl font-bold text-white text-shadow";

                if (distance === 1) {
                    opacityClass = "opacity-60";
                    originalSize = "text-xs md:text-sm text-gray-500";
                    translatedSize = "text-lg md:text-2xl font-semibold text-gray-300";
                } else if (distance >= 2) {
                    opacityClass = "opacity-30";
                    originalSize = "text-[10px] md:text-xs text-gray-600";
                    translatedSize = "text-base md:text-lg font-normal text-gray-400";
                }

                return `
                    <div class="fade-in transition-all duration-300 ${opacityClass} border-b border-gray-900 pb-2">
                        <div class="${originalSize} italic mb-1 truncate">${item.original}</div>
                        <div class="${translatedSize} leading-snug break-keep">${item.translated}</div>
                    </div>
                `;
            }).join('');
        }

        const MODEL_CANDIDATES = ['gemini-2.5-flash', 'gemini-2.5-flash-lite'];
        let activeModel = null;

        async function translateTextWithGemini(text) {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) throw new Error("API Key 없음");

            const systemPrompt = `You are a specialty coffee simultaneous interpreter.
Translate speech into natural, professional Korean using standard coffee industry terms.
- Beneficio -> 가공장 (NEVER '이익' or '혜택')
- Lavado -> 워시드 (NEVER '세탁')
- Natural -> 내추럴, Anaerobic -> 무산소 발효
- Finca -> 농장, Lote -> 로트, Pergamino -> 파치먼트
- Output ONLY the Korean translation. No greetings, no notes.`;

            const payload = {
                contents: [{ parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { 
                    temperature: 0.1,
                    thinkingConfig: {
                        thinkingBudget: 0
                    }
                }
            };

            const modelsToTry = activeModel ? [activeModel] : MODEL_CANDIDATES;
            let lastErrorMsg = "";

            for (const model of modelsToTry) {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const translated = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (translated) {
                            activeModel = model;
                            return translated.trim();
                        }
                    } else {
                        const errData = await response.json().catch(() => ({}));
                        lastErrorMsg = errData.error?.message || `HTTP ${response.status}`;
                    }
                } catch (e) {
                    lastErrorMsg = e.message;
                }
            }
            throw new Error(lastErrorMsg || "번역 호출 실패");
        }

        let silenceTimer = null;
        let speechBuffer = "";

        if (recognition) {
            recognition.onstart = () => {
                updateStatus("마이크 켜짐: 듣는 중... (Listening)", "text-green-400", "bg-gray-900");
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const currentSpeech = (finalTranscript || interimTranscript).trim();

                if (currentSpeech) {
                    speechBuffer = currentSpeech;
                    liveOriginalText.textContent = `🎙️ ${speechBuffer}`;

                    clearTimeout(silenceTimer);
                    // ★ 3초(3000ms) 침묵 감지 후 번역 실행
                    silenceTimer = setTimeout(async () => {
                        const textToTranslate = speechBuffer;
                        speechBuffer = "";
                        liveOriginalText.textContent = "";

                        if (textToTranslate) {
                            const currentItem = {
                                original: textToTranslate,
                                translated: '<span class="text-yellow-400 animate-pulse text-lg md:text-2xl">⏳ 번역 중...</span>'
                            };
                            subtitleHistory.push(currentItem);
                            if (subtitleHistory.length > MAX_HISTORY) subtitleHistory.shift();
                            renderSubtitles();

                            updateStatus("AI 번역 중... (Translating)", "text-yellow-400", "bg-gray-900");

                            try {
                                const translated = await translateTextWithGemini(textToTranslate);
                                currentItem.translated = translated;
                                renderSubtitles();
                                updateStatus("마이크 켜짐: 듣는 중... (Listening)", "text-green-400", "bg-gray-900");
                            } catch (error) {
                                currentItem.translated = `<span class="text-red-500">번역 실패: ${error.message}</span>`;
                                renderSubtitles();
                                updateStatus(`번역 오류`, "text-red-400", "bg-gray-900");
                            }
                        }
                    }, 3000); // 3초 대기
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    updateStatus(`인식 오류: ${event.error}`, "text-red-400", "bg-gray-900");
                }
            };

            recognition.onend = () => {
                if (isRunning) {
                    try { recognition.start(); } catch (e) {}
                } else {
                    updateStatus("마이크 중지됨 (Stopped)", "text-gray-400", "bg-gray-900");
                }
            };
        }

        // 버튼 클릭 제어
        startBtn.addEventListener('click', () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Gemini API Key를 먼저 입력해주세요.");
                updateStatus("API Key를 먼저 입력해주세요.", "text-red-400", "bg-gray-900");
                apiKeyInput.focus();
                return;
            }

            if (!recognition) {
                alert("현재 브라우저는 음성 인식을 지원하지 않습니다.\n카카오톡 인앱 브라우저 등이 아닌 순수 크롬(Chrome) 앱에서 열어주세요.");
                updateStatus("오류: 음성 인식 미지원 브라우저", "text-red-400", "bg-gray-900");
                return;
            }

            try {
                recognition.lang = languageSelect.value;
                isRunning = true;
                recognition.start();
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                settingsPanel.classList.add('settings-hidden');
                showSettingsBtn.classList.remove('hidden');
                liveOriginalText.textContent = "";
            } catch (err) {
                alert("마이크 시작 오류: " + err.message);
                updateStatus("마이크 시작 오류", "text-red-400", "bg-gray-900");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (recognition) {
                isRunning = false;
                recognition.stop();
                stopBtn.classList.add('hidden');
                startBtn.classList.remove('hidden');
            }
        });

        hideSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.add('settings-hidden');
            showSettingsBtn.classList.remove('hidden');
        });

        showSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.remove('settings-hidden');
            showSettingsBtn.classList.add('hidden');
        });

        languageSelect.addEventListener('change', () => {
            if (isRunning && recognition) {
                recognition.stop();
            }
        });
    </script>
</body>
</html>
